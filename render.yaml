services:
  - type: web
    name: salguacate-backend
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: npm ci --ignore-scripts --omit=dev --workspace apps/api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: CORS_ORIGINS
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: DATABASE_DRIVER
        value: libsql
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_DATABASE_HOST
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: IMAGE_STORAGE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
        
  - type: web
    name: salguacate-frontend
    runtime: static
    autoDeployTrigger: off
    buildCommand: npm ci --ignore-scripts --include=dev && npm run build:erp
    staticPublishPath: ./dist/erp
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
